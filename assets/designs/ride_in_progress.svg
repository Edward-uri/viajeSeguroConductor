<svg xmlns="http://www.w3.org/2000/svg" width="440" height="956" viewBox="0 0 440 956">
  <rect width="440" height="956" fill="#FDFBF7"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="440" height="64" fill="#1E8E5A"/>
  <text x="44" y="40" fill="white" font-size="18" font-weight="600" font-family="Plus Jakarta Sans, sans-serif">← Viaje en curso</text>
  
  <!-- Map area (simulated) -->
  <rect x="0" y="64" width="440" height="380" fill="#E8E4E0"/>
  <circle cx="220" cy="254" r="20" fill="#1E8E5A" stroke="white" stroke-width="3"/>
  <text x="217" y="259" fill="white" font-size="18" text-anchor="middle">🏍</text>
  
  <!-- Marker: Origen -->
  <circle cx="160" cy="180" r="14" fill="#FF8F00" stroke="white" stroke-width="3"/>
  
  <!-- Marker: Destino -->
  <circle cx="300" cy="340" r="14" fill="#D32F2F" stroke="white" stroke-width="3"/>
  
  <!-- Bottom sheet -->
  <rect x="0" y="444" width="440" height="512" fill="white" rx="20"/>
  
  <!-- Avatar -->
  <circle cx="220" cy="474" r="24" fill="#FFF1E0"/>
  <text x="220" y="482" fill="#FF8F00" font-size="16" font-weight="700" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">MG</text>
  
  <!-- Passenger name -->
  <text x="220" y="518" fill="#1A1410" font-size="16" font-weight="700" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">María G.</text>
  
  <!-- Route -->
  <text x="220" y="542" fill="#6B6661" font-size="13" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">Av. Hidalgo 123 → Primaria 5 de mayo</text>
  
  <!-- Start ride button -->
  <rect x="32" y="568" width="376" height="56" rx="8" fill="#FF8F00"/>
  <text x="220" y="601" fill="white" font-size="18" font-weight="600" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">Iniciar viaje</text>
</svg>
