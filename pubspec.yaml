name: viajeseguroconductor
description: "Jala — App de moto-taxis para pasajeros."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  google_fonts: ^6.2.1

  device_preview: ^1.3.1

  flutter_riverpod: ^2.6.1

  http: ^1.2.2
  http_parser: ^4.1.2

  flutter_secure_storage: ^9.2.4

  image: ^4.5.3
  image_picker: ^1.1.2

  flutter_svg: ^2.0.17

  geolocator: ^10.1.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_dotenv: ^5.1.0
  crypto: ^3.0.6

  socket_io_client: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - .env
